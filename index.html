<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Global Construction ERP – Full Stack Live Demo</title>
<style>
:root{--bg:#f4f6f9;--card:#fff;--ink:#1c2430;--mut:#6b7686;--line:#e3e8ef;--pri:#e8590c;--pri2:#fff1e8;--dark:#141b26;--ok:#2f9e44;--warn:#f08c00;--bad:#e03131;--blue:#1c7ed6}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;display:flex;min-height:100vh}
aside{width:220px;background:var(--dark);color:#c9d1dc;flex-shrink:0;position:sticky;top:0;height:100vh;overflow:auto}
.brand{padding:18px;color:#fff;font-weight:700;font-size:16px}.brand b{color:var(--pri)}.brand small{display:block;font-weight:400;color:#8995a6;font-size:11px;margin-top:3px}
nav a{display:flex;justify-content:space-between;padding:9px 18px;color:#c9d1dc;cursor:pointer;border-left:3px solid transparent}
nav a:hover{background:#1c2533}nav a.on{background:#1f2a3a;border-left-color:var(--pri);color:#fff}
nav .bd{background:var(--pri);color:#fff;border-radius:99px;padding:0 7px;font-size:11px;font-weight:700}
main{flex:1;min-width:0}
header{background:#fff;border-bottom:1px solid var(--line);padding:10px 20px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5;flex-wrap:wrap}
header h1{font-size:17px;flex:1;min-width:120px}
select,input,textarea,button{font:inherit}
select,.inp,input,textarea{border:1px solid var(--line);border-radius:7px;padding:6px 9px;background:#fff;color:var(--ink)}
.btn{background:var(--pri);color:#fff;border:0;border-radius:7px;padding:7px 14px;cursor:pointer;font-weight:600}
.btn.sec{background:#fff;color:var(--ink);border:1px solid var(--line)}.btn.ok{background:var(--ok)}.btn.bad{background:var(--bad)}
.btn.sm{padding:3px 10px;font-size:12.5px}.btn:disabled{opacity:.4;cursor:not-allowed}
.wrap{padding:20px 22px 60px}
.grid{display:grid;gap:14px}.kpis{grid-template-columns:repeat(auto-fit,minmax(160px,1fr));margin-bottom:14px}
.two{grid-template-columns:repeat(auto-fit,minmax(360px,1fr))}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:15px;margin-bottom:14px}
.card h3{font-size:14px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.kpi{margin:0}.kpi .l{color:var(--mut);font-size:12px}.kpi .v{font-size:23px;font-weight:700;margin:3px 0}.kpi .d{font-size:12px;color:var(--mut)}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);padding:7px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 7px;border-bottom:1px solid #eef1f5;vertical-align:middle}tr:last-child td{border-bottom:0}
.num{text-align:right;font-variant-numeric:tabular-nums}.mut{color:var(--mut)}.dn{color:var(--bad)}.up{color:var(--ok)}
tr.click{cursor:pointer}tr.click:hover{background:#fafbfd}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11.5px;font-weight:600;white-space:nowrap}
.t-ok{background:#e6f6ea;color:#237a37}.t-warn{background:#fff3d6;color:#a86a00}.t-bad{background:#fde8e8;color:#b02525}.t-blue{background:#e3f0fc;color:#165f9f}.t-gray{background:#edf0f4;color:#4b5666}
.bar{height:8px;background:#edf0f4;border-radius:99px;overflow:hidden;min-width:60px}.bar i{display:block;height:100%;background:var(--pri)}.bar.g i{background:var(--ok)}.bar.r i{background:var(--bad)}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}.tabs button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:5px 13px;cursor:pointer}.tabs button.on{background:var(--dark);color:#fff;border-color:var(--dark)}
.note{background:#fff8e6;border:1px solid #ffe4a1;border-radius:99px;padding:9px 16px;font-size:12.5px;margin-bottom:12px;color:#6b4e00}
.f{display:grid;gap:10px;margin-bottom:12px}.f label{font-size:12px;color:var(--mut);display:grid;gap:4px}.f input,.f select,.f textarea{width:100%}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modal{position:fixed;inset:0;background:rgba(10,15,25,.5);display:none;place-items:center;z-index:50;padding:14px}.modal.on{display:grid}
.mbox{background:#fff;border-radius:14px;padding:20px;width:min(600px,100%);max-height:92vh;overflow:auto}.mbox h2{font-size:17px;margin-bottom:12px}
.toast{position:fixed;bottom:18px;right:18px;background:var(--dark);color:#fff;padding:10px 16px;border-radius:9px;opacity:0;transition:.25s;pointer-events:none;z-index:60;max-width:380px}.toast.on{opacity:1}
.stg{display:grid;grid-template-columns:34px 1.6fr 1fr 1.1fr auto;gap:10px;align-items:center;padding:10px 4px;border-bottom:1px solid #eef1f5}
.stg:last-child{border:0}.stg .c{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:12px;color:var(--mut)}
.stg.DONE .c{background:var(--ok);border-color:var(--ok);color:#fff}.stg.IP .c{border-color:var(--pri);color:var(--pri)}.stg.lock{opacity:.55}
.login{position:fixed;inset:0;background:linear-gradient(135deg,#141b26,#2a3a52);z-index:80;display:none;place-items:center;padding:16px}.login.on{display:grid}
.lbox{background:#fff;border-radius:16px;padding:26px;width:min(720px,100%)}.lbox h2{font-size:22px}.lbox p{color:var(--mut);margin:4px 0 16px}
.ugrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.uc{border:1px solid var(--line);border-radius:11px;padding:12px;cursor:pointer}.uc:hover{border-color:var(--pri);background:var(--pri2)}.uc b{display:block}.uc span{font-size:12px;color:var(--mut)}
.log{font-size:12.5px;padding:6px 0;border-bottom:1px solid #eef1f5}.log small{color:var(--mut)}
@media(max-width:820px){aside{display:none}.two{grid-template-columns:1fr}.stg{grid-template-columns:30px 1fr;}}
#rb,#lg{display:inline-flex;background:#edf0f4;border-radius:99px;padding:3px;gap:2px;flex-wrap:wrap}#rb button,#lg button{border:0;background:transparent;border-radius:99px;padding:5px 12px;cursor:pointer;font-size:12.5px;font-weight:600;color:#4b5666;white-space:nowrap}#rb button:hover,#lg button:hover{color:var(--ink)}#rb button.on,#lg button.on{background:var(--dark);color:#fff}#usel{display:none}.qa-a{display:flex;gap:8px;flex-wrap:wrap}
.db-badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:99px;background:#e6f6ea;color:#237a37;border:1px solid #b6e2c0}
</style></head><body>
<aside><div class="brand">Global Construction <b>ERP</b><small>Tender to Handover · Full Stack Live</small></div><nav id="nav"></nav></aside>
<main>
<header><h1 id="title"></h1>
<span class="db-badge" title="Live SQLite Database Backend">● SQLite DB</span>
<select id="ap" title="Active project"></select>
<span class="inp" id="dt" style="display:flex;gap:6px;align-items:center">📅 <b id="dtv"></b> <button class="btn sec sm" onclick="adv(1)">+1 day</button><button class="btn sec sm" onclick="adv(7)">+7</button></span>
<span id="lg"></span><button class="btn sec sm" id="off" onclick="togOff()"></button><div class="rb" id="rb"></div><select id="usel" title="Switch user"></select>
<button class="btn sec sm" onclick="resetDemo()">Reset</button></header>
<div class="wrap" id="view"></div></main>
<div class="modal" id="modal"><div class="mbox" id="mbox"></div></div>
<div class="login" id="login"><div class="lbox"><h2>Global Construction ERP</h2><p>Full-Stack Demo login – pick a person. Powered by Node.js & SQLite database backend. Switch user any time from the top bar.</p><div class="ugrid" id="ugrid"></div></div></div>
<div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,8);
const LS='cerp_live_v4';
const ROLES={owner:'Owner / MD',pm:'Project Manager',eng:'Site Engineer',sup:'Supervisor',store:'Store Manager',qa:'QA Engineer',acc:'Accountant'};
const PERM={createProject:['owner','pm'],team:['owner','pm'],stage:['owner','pm'],approve:['owner','pm'],raisePR:['owner','pm','eng','sup','store'],po:['owner','pm','acc'],grn:['store','owner','pm'],dpr:['eng','sup','pm'],labour:['eng','sup','pm'],qa:['qa','owner'],bill:['acc','owner'],expense:['acc','owner'],handover:['owner','pm']};
const NAV=[['dash','Dashboard'],['proj','Projects'],['att','Attendance'],['dpr','Daily Progress'],['plan','Planning & Gantt'],['boq','BOQ & Estimation'],['mat','Materials & Procurement'],['qa','QA Inspections'],['fin','Billing & Costs'],['crm','Property Sales'],['int','Integrations Map'],['roles','Roles & Access'],['log','Audit Trail']];
const MATS=[['M1','Cement OPC 53','Bags',410],['M2','TMT Steel Fe500D','Kg',68],['M3','River Sand','Tons',1800],['M4','Aggregate 20mm','Tons',1500],['M5','Red Bricks','Nos',9],['M6','Vitrified Tiles','m²',980],['M7','Paint (Emulsion)','Litres',380],['M8','PVC / Conduit Pipes','Mtrs',120]];
const mat=id=>MATS.find(m=>m[0]===id);
const TPL=[
['Land Survey & Marking',5,5,0,[]],['Excavation',10,5,1,[]],['Foundation',25,15,1,[['M1',60],['M2',600],['M3',8],['M4',12]]],
['Pillars & Beams',30,12,1,[['M1',40],['M2',500],['M3',5],['M4',8]]],['Slab Work',25,15,1,[['M1',70],['M2',700],['M3',9],['M4',14]]],
['Brick Work',30,10,1,[['M1',25],['M3',12],['M5',4500]]],['Electrical & Plumbing',25,8,1,[['M8',60]]],['Plastering',20,8,1,[['M1',30],['M3',14]]],
['Flooring',20,8,1,[['M6',95],['M1',10],['M3',3]]],['Painting',15,6,1,[['M7',40]]],['Final Finishing',10,5,1,[]],['Handover',5,3,0,[]]];
const USERS=[
{id:'u1',name:'Mohan S.',role:'owner',cost:0},{id:'u2',name:'Ravi Kumar',role:'pm',cost:3500},{id:'u3',name:'Anitha Rao',role:'eng',cost:2200},
{id:'u4',name:'Suresh (Supervisor)',role:'sup',cost:1500},{id:'u5',name:'Lakshmi (Stores)',role:'store',cost:1400},{id:'u6',name:'Sita Devi',role:'qa',cost:2300},{id:'u7',name:'Prakash (Accounts)',role:'acc',cost:0}];
const CITIES={Hyderabad:[17.4326,78.4071],Visakhapatnam:[17.7231,83.3013],Vijayawada:[16.5062,80.648],Kigali:[-1.9441,30.0619]};
const TRADES=[['Mason',900],['Helper',550],['Electrician',1000],['Plumber',950],['Carpenter',900],['Bar Bender',850]];
const NAMES=['Venkat','Kishore','Raju','Lakshmi','Ramesh','Naresh','Gopal','Mahesh','Srinu','Padma','Anil','Satish'];
let S={today:new Date().toISOString().slice(0,10),me:'u1',ap:'P003',users:USERS,projects:[],stock:{},prs:[],att:[],dprs:[],insp:[],inv:[],exp:[],log:[],cube:0,hse:[],units:{},wa:[]};

function addDays(d,n){const x=new Date(d+'T00:00:00Z');x.setUTCDate(x.getUTCDate()+n);return x.toISOString().slice(0,10)}
function diff(a,b){return Math.round((new Date(b)-new Date(a))/864e5)}
const todayISO=()=>new Date().toISOString().slice(0,10);

/* ---- Full Stack API Bridge ---- */
async function api(path, body=null){
 try{
  const res = await fetch(path, {
   method: 'POST',
   headers: { 'Content-Type': 'application/json' },
   body: body ? JSON.stringify(body) : null
  });
  const json = await res.json();
  if(json && json.state){
   S = json.state;
   save();
   render();
  }
  return json;
 }catch(e){
  console.warn('API fetch error, falling back locally:', e);
  return null;
 }
}

async function loadServerState(){
 try{
  const res = await fetch('/api/state');
  if(res.ok){
   const json = await res.json();
   if(json && json.projects && json.projects.length){
    S = json;
    save();
    return true;
   }
  }
 }catch(e){}
 return false;
}

function save(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
function load(){try{const x=localStorage.getItem(LS);if(x){S=JSON.parse(x);return true}}catch(e){}return false}
async function resetDemo(){
 if(!confirm('Reset all demo data in SQLite database?'))return;
 const res = await api('/api/system/reset');
 if(res && res.ok){
  toast('Database re-seeded successfully');
  boot();
 } else {
  try{localStorage.removeItem(LS)}catch(e){};
  location.reload();
 }
}

const me=()=>S.users.find(u=>u.id===S.me)||S.users[0];
const can=a=>me().role==='owner'||PERM[a].includes(me().role);
const uname=id=>(S.users.find(u=>u.id===id)||{name:id}).name;
function log(msg,pid){S.log.unshift({t:new Date().toISOString(),d:S.today,u:S.me?uname(S.me):'System',msg,pid});if(S.log.length>300)S.log.pop()}
const vis=()=>S.projects.filter(p=>['owner','acc'].includes(me().role)||p.team.includes(S.me));
const P=()=>S.projects.find(p=>p.id===S.ap);
const mn=n=>n>=1e7?'₹'+(n/1e7).toFixed(2)+' Cr':n>=1e5?'₹'+(n/1e5).toFixed(2)+' L':'₹'+Math.round(n).toLocaleString('en-IN');
const nf=n=>Math.round(n).toLocaleString('en-IN');
const TAGS={Planning:'gray','In Progress':'blue',Completed:'ok',Delayed:'bad','On Track':'ok',Requested:'warn',Approved:'blue',Ordered:'blue',Received:'ok',Rejected:'bad',Submitted:'warn',Pending:'warn',Paid:'ok',Passed:'ok',Failed:'bad',Present:'ok',Absent:'bad','On-site':'ok','Off-site':'bad',DONE:'ok',IP:'blue',NS:'gray',Open:'warn'};
const tag=(s,l)=>`<span class="tag t-${TAGS[s]||'gray'}">${l||s}</span>`;
const bar=(p,c='')=>`<div class="bar ${c}"><i style="width:${Math.min(100,p)}%"></i></div>`;
const kpi=(l,v,d)=>`<div class="card kpi"><div class="l">${l}</div><div class="v">${v}</div><div class="d">${d||''}</div></div>`;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),2800)}
function modal(h){$('#mbox').innerHTML=h;$('#modal').classList.add('on')}
function closeM(){$('#modal').classList.remove('on')}
$('#modal').onclick=e=>{if(e.target.id==='modal')closeM()};

async function adv(n){
 S.today=addDays(S.today,n);
 render();
 toast('Date → '+S.today);
 await api('/api/system/advance-date', { days: n });
}

// derived
function stageProgress(p){return p.stages.reduce((a,s)=>a+s.prog*(s.dur/220),0)}
function planPct(p){const tot=diff(p.start,p.end);return Math.max(0,Math.min(100,diff(p.start,S.today)/tot*100))}
function pstatus(p){if(p.status==='Completed')return'Completed';if(p.status==='Planning')return'Planning';return p.stages.some(s=>s.status!=='DONE'&&s.pe<S.today)?'Delayed':'On Track'}
function labourCost(p){return S.att.filter(a=>a.pid===p.id).reduce((t,a)=>t+a.cost,0)}
function matCost(p){return S.prs.filter(r=>r.pid===p.id&&r.st==='Received').reduce((t,r)=>t+r.qty*r.rate,0)}
function otherCost(p){return S.exp.filter(e=>e.pid===p.id).reduce((t,e)=>t+e.amt,0)}
function actual(p){return labourCost(p)+matCost(p)+otherCost(p)}
function pending(){
 const r=me().role,v=vis().map(p=>p.id),o=[];
 if(['owner','pm'].includes(r)){const a=S.dprs.filter(d=>v.includes(d.pid)&&d.st==='Submitted').length;if(a)o.push(['dpr',`${a} DPR(s) awaiting approval`]);
  const b=S.prs.filter(x=>v.includes(x.pid)&&x.st==='Requested').length;if(b)o.push(['mat',`${b} material request(s) to approve`])}
 if(['owner','pm','acc'].includes(r)){const c=S.prs.filter(x=>v.includes(x.pid)&&x.st==='Approved').length;if(c)o.push(['mat',`${c} approved request(s) need a Purchase Order`])}
 if(['store','owner','pm'].includes(r)){const c=S.prs.filter(x=>v.includes(x.pid)&&x.st==='Ordered').length;if(c)o.push(['mat',`${c} PO(s) awaiting goods receipt (GRN)`])}
 if(['qa','owner'].includes(r)){const c=S.projects.filter(p=>v.includes(p.id)).reduce((t,p)=>t+p.stages.filter(s=>s.qa&&s.status==='IP'&&s.prog>=100&&!S.insp.some(i=>i.pid===p.id&&i.k===s.k&&i.res==='Passed')).length,0);if(c)o.push(['qa',`${c} stage(s) ready for inspection`])}
 if(['acc','owner'].includes(r)){const c=S.inv.filter(i=>i.st==='Pending').length;if(c)o.push(['fin',`${c} invoice(s) awaiting payment`])}
 return o}
const V={};let AF={};
async function boot(){
 $('#ugrid').innerHTML=S.users.map(u=>`<div class="uc" onclick="loginAs('${u.id}')"><b>${u.name}</b><span>${ROLES[u.role]}</span></div>`).join('');
 if(!S.me){$('#login').classList.add('on');return}
 $('#login').classList.remove('on');
 $('#usel').innerHTML=S.users.map(u=>`<option value="${u.id}" ${u.id===S.me?'selected':''}>${u.name} · ${ROLES[u.role]}</option>`).join('');
 $('#usel').onchange=async e=>{await loginAs(e.target.value)};
 afterLogin(true);
}
async function loginAs(id){
 S.me=id;
 $('#login').classList.remove('on');
 afterLogin();
 await api('/api/system/switch-user', { userId: id });
}
function afterLogin(){const v=vis();if(!v.find(p=>p.id===S.ap))S.ap=v[0]?v[0].id:null;S.v=S.v||'dash';render()}
$('#ap').onchange=async e=>{
 S.ap=e.target.value;
 save();
 render();
 await api('/api/system/switch-project', { projectId: e.target.value });
};
function go(v,pd){S.v=v;if(pd)S.pd=pd;render();window.scrollTo(0,0)}
function render(){
 const v=vis(),pe=pending();
 $('#ap').innerHTML=v.map(p=>`<option value="${p.id}" ${p.id===S.ap?'selected':''}>${p.id} · ${p.name}</option>`).join('')||'<option>No project</option>';
 $('#dtv').textContent=S.today;$('#rb').innerHTML=rolebar();
 const cnt=k=>{const n=pe.filter(x=>x[0]===k).length;return n?`<span class="bd">${n}</span>`:''};
 $('#nav').innerHTML=NAV.map(([k,l])=>`<a class="${S.v===k||(S.v==='pd'&&k==='proj')?'on':''}" onclick="go('${k}')">${l}${cnt(k)}</a>`).join('');
 $('#title').textContent=(S.v==='pd'?'Project Detail':NAV.find(n=>n[0]===S.v)[1]);
 $('#view').innerHTML=V[S.v]();if(AF[S.v])AF[S.v]();save()}
V.dash=()=>{
 const v=vis(),pe=pending(),act=v.filter(p=>p.status==='In Progress').length;
 const tot=v.reduce((a,p)=>a+p.contract,0),spent=v.reduce((a,p)=>a+actual(p),0),inv=S.inv.filter(i=>v.find(p=>p.id===i.pid)),out=inv.filter(i=>i.st==='Pending').reduce((a,i)=>a+i.amt,0);
 const today=S.att.filter(a=>a.d===S.today&&v.find(p=>p.id===a.pid)&&a.pres).length;
 return `<div class="grid kpis">${kpi('Projects',v.length,act+' in progress')}${kpi('Contract Value',mn(tot))}${kpi('Actual Cost',mn(spent),tot?Math.round(spent/tot*100)+'% of contract':'')}${kpi('Outstanding Bills',mn(out))}${kpi('Present Today',today,'staff + labour')}</div>
<div class="grid two"><div class="card"><h3>My Tasks (${ROLES[me().role]})</h3>${pe.length?pe.map(x=>`<div class="log"><a style="cursor:pointer;color:var(--pri)" onclick="go('${x[0]}')">${x[1]} →</a></div>`).join(''):'<p class="mut">Nothing pending for you.</p>'}</div>
<div class="card"><h3>Projects</h3><table><tbody>${v.map(p=>`<tr class="click" onclick="S.ap='${p.id}';go('pd','${p.id}')"><td><b>${p.name}</b><br><small class="mut">${p.city}</small></td><td style="width:90px">${bar(stageProgress(p))}<small>${stageProgress(p).toFixed(0)}%</small></td><td>${tag(pstatus(p))}</td></tr>`).join('')||'<tr><td class="mut">No projects assigned to you</td></tr>'}</tbody></table></div></div>
<div class="card"><h3>Recent Activity (SQLite Audit Trail)</h3>${S.log.filter(l=>!l.pid||v.find(p=>p.id===l.pid)).slice(0,12).map(l=>`<div class="log">${l.msg}<br><small>${l.u} · ${l.d}</small></div>`).join('')}</div>`};
V.proj=()=>{const v=vis();return `<div class="card"><h3>All Projects ${can('createProject')?'<button class="btn" onclick="newProj()">+ New Project</button>':''}</h3>
<table><thead><tr><th>ID</th><th>Project</th><th>Client</th><th>Location</th><th>Start → End</th><th class="num">Contract</th><th>Progress</th><th>Status</th></tr></thead><tbody>${v.map(p=>`<tr class="click" onclick="S.ap='${p.id}';go('pd','${p.id}')"><td>${p.id}</td><td><b>${p.name}</b></td><td>${p.client}</td><td>${p.city}</td><td>${p.start} → ${p.end}</td><td class="num">${mn(p.contract)}</td><td style="width:100px">${bar(stageProgress(p))}<small>${stageProgress(p).toFixed(0)}%</small></td><td>${tag(pstatus(p))}</td></tr>`).join('')}</tbody></table></div>`};
function newProj(){
 modal(`<h2>New Project</h2><div class="f"><label>Project name<input id="n1" value="G+3 Apartment – Madhurawada"></label>
 <div class="f2"><label>Client<input id="n2" value="Sri Constructions"></label><label>Type<select id="n3"><option>Villa</option><option>Apartment</option><option>High-rise</option><option>Commercial</option><option>Infrastructure</option></select></label></div>
 <label>Site address<input id="n4" value="Survey No. 88, Madhurawada"></label>

function dist(a,b,c,d){const R=6371000,r=x=>x*Math.PI/180,dl=r(c-a),dn=r(d-b),h=Math.sin(dl/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h))}

async function chk(mode){
 const p=P();
 const rec=async(la,lo)=>{
  const d=dist(la,lo,p.lat,p.lng),on=d<=p.radius;
  const res = await api('/api/attendance/checkin', { projectId: p.id, method: 'GPS', dist: d, onsite: on });
  if(res && res.ok) toast(on?'Checked in – on site ✓ (SQLite)':'Outside geofence – attendance not counted');
 };
 if(mode==='on')return rec(p.lat+(Math.random()-.5)*.0006,p.lng+(Math.random()-.5)*.0006);
 if(mode==='off')return rec(p.lat+.027,p.lng);
 if(!navigator.geolocation)return toast('GPS not available here – use Simulate');
 navigator.geolocation.getCurrentPosition(x=>rec(x.coords.latitude,x.coords.longitude),()=>toast('GPS blocked in this view – use Simulate buttons'))
}

function qrSVG(id){let h=0;for(const c of id)h=(h*31+c.charCodeAt(0))>>>0;const n=21,c=6;let s=`<svg viewBox="0 0 ${n*c} ${n*c}" width="150" style="border:1px solid #ddd;border-radius:6px"><rect width="100%" height="100%" fill="#fff"/>`;
 const f=(x,y)=>`<rect x="${x*c}" y="${y*c}" width="${7*c}" height="${7*c}" fill="#000"/><rect x="${(x+1)*c}" y="${(y+1)*c}" width="${5*c}" height="${5*c}" fill="#fff"/><rect x="${(x+2)*c}" y="${(y+2)*c}" width="${3*c}" height="${3*c}" fill="#000"/>`;
 s+=f(0,0)+f(14,0)+f(0,14);let r=h;for(let y=0;y<n;y++)for(let x=0;x<n;x++){if((x<8&&y<8)||(x>12&&y<8)||(x<8&&y>12))continue;r=(r*1103515245+12345)>>>0;if(r>>16&1)s+=`<rect x="${x*c}" y="${y*c}" width="${c}" height="${c}" fill="#000"/>`}return s+'</svg>'}

 return `<div class="grid kpis">${kpi('Staff on project',st.length)}${kpi('Present today',today.filter(a=>a&&a.pres).length,'of '+st.length)}${kpi('On leave today',today.filter(a=>a&&a.leave).length)}${kpi('Month payroll (days × rate)',mn(sm(rows,r=>r.pay)))}</div>

<div style="overflow-x:auto"><table style="min-width:900px"><thead><tr><th style="position:sticky;left:0;background:#fff">Staff</th>${Array.from({length:N},(_,i)=>`<th style="padding:3px;text-align:center">${i+1}</th>`).join('')}<th class="num">P</th><th class="num">L</th><th class="num">A</th><th class="num">Pay</th></tr></thead><tbody>${rows.map(r=>`<tr><td style="position:sticky;left:0;background:#fff;white-space:nowrap"><b>${r.u.name}</b><br><small class="mut">${ROLES[r.u.role]}</small></td>${r.cells}<td class="num">${r.P}</td><td class="num">${r.L}</td><td class="num">${r.A}</td><td class="num">${mn(r.pay)}</td></tr>`).join('')}</tbody></table></div>
<p class="mut" style="font-size:12px;margin-top:8px"><b style="color:#2f9e44">P</b> Present · <b style="color:#e03131">A</b> Absent · <b style="color:#f08c00">L</b> Leave · <b style="color:#9aa5b4">W</b> Weekly off. Stored in SQLite.</p></div>
${can('approve')?`<div class="card"><h3>Mark Today – ${S.today} <span><button class="btn sec sm" onclick="document.querySelectorAll('.sm-s').forEach(s=>s.value='P')">All present</button> <button class="btn sm" onclick="staffMark()">Save</button></span></h3><table><tbody>${st.map((u,i)=>`<tr><td>${u.name} <small class="mut">${ROLES[u.role]}</small></td><td>${today[i]?`${tag(today[i].pres?'Present':'Absent',today[i].pres?'Present '+(today[i].method||''):today[i].leave?'Leave':'Absent')}`:'<span class="mut">not marked</span>'}</td><td><select class="sm-s" data-u="${u.id}"><option value="P" ${today[i]&&today[i].pres||!today[i]?'selected':''}>Present</option><option value="A" ${today[i]&&!today[i].pres&&!today[i].leave?'selected':''}>Absent</option><option value="L" ${today[i]&&today[i].leave?'selected':''}>Leave</option></select></td></tr>`).join('')}</tbody></table></div>`:''}
<div class="card"><h3>Recent Check-ins</h3><table><thead><tr><th>Date</th><th>Staff</th><th>In</th><th>Out</th><th>Method</th><th class="num">Hours</th></tr></thead><tbody>${S.att.filter(a=>a.pid===p.id&&a.type==='staff').slice(-12).reverse().map(a=>`<tr><td>${a.d}</td><td>${a.name}</td><td>${a.in||'–'}</td><td>${a.out||'–'}</td><td>${a.method||(a.leave?'Leave':'GPS')}</td><td class="num">${a.hours}</td></tr>`).join('')}</tbody></table></div>`};
async function staffMark(){
 const p=P();
 const records = [...document.querySelectorAll('.sm-s')].map(s=>({ uid: s.dataset.u, val: s.value }));
 const res = await api('/api/attendance/staff-mark', { projectId: p.id, records });
 if(res && res.ok) toast(`Staff attendance saved to SQLite – ${res.count} present`);
}

// Startup: Hydrate from SQLite Server
(async function initApp(){
 const loaded = await loadServerState();
 if(!loaded && !load()){
  console.log('Using local fallback state');
 }
 if(!S.me)S.me='u1';
 if(!S.v||S.v==='dash')S.v='today';
 boot();
})();
</script></body></html>
